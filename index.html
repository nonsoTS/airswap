<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />

    <!-- ── Primary Meta ─────────────────────────────────────────── -->
    <title>AirSwap — Convert Airtime to Cash · Buy Cheap Data</title>
    <meta name="description" content="Instantly convert excess airtime to cash or buy cheap data bundles. Fast payouts, all Nigerian networks, stress-free." />
    <meta name="keywords" content="airtime to cash, buy data Nigeria, MTN data, Airtel data, cheap data bundles, airtime swap" />
    <meta name="author" content="AirSwap" />
    <meta name="robots" content="index, follow" />

    <!-- ── Theme Colors ──────────────────────────────────────────── -->
    <meta name="theme-color" content="#FAF8F5" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#080C14" media="(prefers-color-scheme: dark)" />

    <!-- ── PWA / App Shell ───────────────────────────────────────── -->
    <link rel="manifest" href="/site.webmanifest" />

    <!-- iOS PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="AirSwap" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Android / Chrome -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="application-name" content="AirSwap" />

    <!-- MS Tiles (Edge / Windows) -->
    <meta name="msapplication-TileColor" content="#00C060" />
    <meta name="msapplication-TileImage" content="/android-chrome-192x192.png" />
    <meta name="msapplication-config" content="none" />

    <!-- ── Favicons ──────────────────────────────────────────────── -->
    <!-- SVG favicon — modern browsers (Chrome 80+, Firefox 41+, Safari 12+) -->
    <link rel="icon" type="image/ico" href="/favicon.ico" />
    <!-- Fallback for older browsers — Vite will generate this from the SVG -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <!-- Shortcut icon legacy fallback -->
    <link rel="shortcut icon" href="/favicon.ico" />

    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="AirSwap — Fast Airtime & Data Platform" />
    <meta property="og:locale" content="en_NG" />

    <!-- ── Twitter / X Card ─────────────────────────────────────── -->
    <meta name="twitter:card" content="summary_large_image" />
